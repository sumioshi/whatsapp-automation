name: Landing (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/site-build.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo para o lastmod da home no sitemap (data do último commit do arquivo).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar a dependência do build
        # Versão fixa, fora do package.json; a mesma constante MARKED_VERSION do script.
        run: npm i --no-save --no-package-lock --no-audit --no-fund --prefix .site-deps marked@18.1.3
      - name: Montar o site
        # Gera _site/ com blog, sitemap.xml, robots.txt, feed.xml, llms.txt e CNAME (wacrew.com.br).
        run: node scripts/site-build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
