p{margin:0 0 28px;color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.btn{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:10px;background:var(--accent);color:#fff;font:500 15px/1 inherit;text-decoration:none}
.btn:hover{background:var(--accent-ink);color:#fff}
